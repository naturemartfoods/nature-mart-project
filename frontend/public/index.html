<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ PRIMARY FAVICON (IMPORTANT) -->
    <link rel="icon" href="./favicon.ico" />

    <!-- ✅ PNG FAVICONS (fallback + modern browsers) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./logo.png" />

    <!-- ✅ Apple Devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="./logo.png" />

    <!-- ✅ Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ✅ Theme Color -->
    <meta name="theme-color" content="#2e7d32" />

    <!-- ✅ SEO Title -->
    <title>Nature Mart Foods | Pure Natural Healthy Products</title>

    <!-- ✅ SEO Meta -->
    <meta
      name="description"
      content="Nature Mart Foods - Pure, Natural, Healthy. From our farm to your kitchen. Handpicked superfoods delivered across India."
    />
    <meta
      name="keywords"
      content="Nature Mart Foods, organic food India, natural products, farm fresh, healthy food, spices, seeds"
    />
    <meta name="author" content="Nature Mart Foods" />

    <!-- ✅ Canonical -->
    <link rel="canonical" href="https://naturemartfoods.com/" />

    <!-- ✅ Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ Open Graph -->
    <meta property="og:title" content="Nature Mart Foods | Pure Natural Healthy Products" />
    <meta property="og:description" content="Pure, Natural, Healthy food delivered across India." />
    <meta property="og:image" content="https://naturemartfoods.com/logo.png" />
    <meta property="og:url" content="https://naturemartfoods.com/" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nature Mart Foods" />
    <meta name="twitter:description" content="Pure, Natural, Healthy food delivered across India." />
    <meta name="twitter:image" content="https://naturemartfoods.com/logo.png" />

  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React Root -->
    <div id="root"></div>

  </body>
</html>
